<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<!-- viewport-fit=cover: let the page own the safe area itself (see the
     STATUS-INSET RESOLVER below). The APK shell is NOT edge-to-edge, so
     env(safe-area-inset-top) is 0 there and the header needs no padding. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#8c1d40" />
<link rel="icon" type="image/png" href="mtr.png" />
<link rel="apple-touch-icon" href="mtr.png" />
<title>Ansum 港鐵巴士</title>
<style>
  /* === BRAND ===
     Maroon, matching MTR Bus livery. Deliberately not another red: index.html
     is #1a3d7c, gmb.html #0d5e3a, rmb.html #c8102e — this one is darker and
     browner so the four modes are told apart at a glance, not just by title.
     The colour appears in four places and they must stay in sync:
       theme-color meta, html background, header.app-header background,
       and the APK's HEADER_COLOR map (android/.../MainActivity.java). */
  :root {
    --brand: #8c1d40;
    --brand-dark: #6d1430;
    --page: #f5f7fb;
    --line: #e4e8f0;
    --ink: #22304a;
    --muted: #7b879b;
    --font-scale: 1;
    --status-inset: 0px;
    --nav-inset: 0px;
    /* Must be declared: without it `padding-top: max(10px, var(--inset-top))`
       is an INVALID declaration before the resolver runs and gets dropped,
       so first paint and settled paint disagree — that mismatch is half of
       the header "flash" bug. */
    --inset-top: 0px;
    --inset-bottom: 0px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html { background: #8c1d40; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK",
                 "Microsoft JhengHei", "Noto Sans TC", Roboto, sans-serif;
    color: var(--ink);
  }
  button, input, select { font-family: inherit; -webkit-appearance: none; appearance: none; touch-action: manipulation; }

  /* === HEADER === */
  header.app-header {
    background: #8c1d40; color: #fff; padding: 10px 16px;
    flex-shrink: 0; display: flex; align-items: center;
    justify-content: space-between; gap: 12px;
    min-width: 0;
    padding-top: max(10px, var(--inset-top));
  }
  header.app-header h1 {
    margin: 0; font-size: calc(17px * var(--font-scale)); white-space: nowrap;
    display: flex; align-items: center; gap: 9px; min-width: 0; overflow: hidden;
  }
  .header-logo-badge {
    width: 34px; height: 34px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.28), 0 1px 4px rgba(0,0,0,0.3);
  }
  .header-logo { width: 24px; height: 24px; flex-shrink: 0; object-fit: contain; display: block; }
  .back-btn {
    background: rgba(255,255,255,0.18); color: #fff; border: none; border-radius: 8px;
    padding: 6px 12px; font-size: calc(14px * var(--font-scale)); font-weight: 700;
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; gap: 4px;
    white-space: nowrap; text-decoration: none;
  }
  .header-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .header-clock {
    font-size: calc(14px * var(--font-scale)); font-weight: 600; letter-spacing: 0.4px;
    font-variant-numeric: tabular-nums; opacity: 0.95; white-space: nowrap;
  }
  .font-size-controls { display: flex; align-items: center; gap: 4px; }
  .font-btn {
    width: 28px; height: 28px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.15);
    color: #fff; font-size: 16px; font-weight: 700; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .font-btn:active { transform: scale(0.95); }

  /* === LAYOUT === */
  #app { display: flex; flex-direction: column; height: 100%; }
  #app[data-booting] { display: none !important; }
  .layout { flex: 1 1 auto; min-height: 0; display: flex; gap: 14px; padding: 14px; }
  .panel {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 1px 3px rgba(20,35,70,0.05);
  }
  .sidebar {
    width: 320px; flex-shrink: 0; display: flex; flex-direction: column;
    min-height: 0; overflow-y: auto; padding: 12px;
    padding-bottom: calc(12px + var(--inset-bottom));
  }
  .main-area { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }

  /* === SIDEBAR PIECES === */
  .sec-title {
    font-size: calc(12px * var(--font-scale)); font-weight: 700; color: var(--muted);
    letter-spacing: 0.6px; margin: 2px 0 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 5px 12px; font-size: calc(13px * var(--font-scale));
    cursor: pointer; font-weight: 600;
  }
  .chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .search {
    width: 100%; border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 11px; font-size: calc(14px * var(--font-scale)); margin-bottom: 10px;
    color: var(--ink); background: #fff;
  }
  .search:focus { outline: 2px solid rgba(140,29,64,0.35); border-color: var(--brand); }
  .route-list { display: flex; flex-direction: column; gap: 4px; }
  .route-btn {
    display: flex; align-items: baseline; gap: 9px; width: 100%; text-align: left;
    border: 1px solid transparent; background: none; border-radius: 9px;
    padding: 8px 9px; cursor: pointer; color: var(--ink);
  }
  .route-btn:hover { background: #f7f9fc; }
  .route-btn.active { background: #fbeef3; border-color: #e9c4d1; }
  .route-no { font-weight: 800; font-size: calc(15px * var(--font-scale)); color: var(--brand); min-width: 52px; }
  .route-desc { font-size: calc(12px * var(--font-scale)); color: var(--muted); min-width: 0; }
  .empty-note { color: var(--muted); font-size: calc(13px * var(--font-scale)); padding: 8px 2px; }

  .other-modes { margin-top: auto; padding-top: 16px; }
  .mode-link {
    display: flex; align-items: center; gap: 10px; text-decoration: none;
    padding: 8px 9px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 6px;
  }
  .mode-link:active { background: #f7f9fc; }
  .mode-icon-img { width: 46px; height: 30px; flex-shrink: 0; object-fit: contain; display: block; }
  .mode-text { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .mode-title { font-size: calc(15px * var(--font-scale)); font-weight: 700; color: var(--brand); }
  .mode-desc { font-size: calc(11px * var(--font-scale)); color: #888; }
  .mode-arrow { color: var(--muted); flex-shrink: 0; }

  /* === STOP LIST === */
  .main-area .panel { padding: 12px 14px; }
  .route-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .route-head h2 { margin: 0; font-size: calc(22px * var(--font-scale)); color: var(--brand); }
  .route-head .sub { font-size: calc(13px * var(--font-scale)); color: var(--muted); }
  .dir-tabs { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
  .dir-tab {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 9px; padding: 7px 12px; cursor: pointer;
    font-size: calc(13px * var(--font-scale)); font-weight: 600;
  }
  .dir-tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .updated { font-size: calc(12px * var(--font-scale)); color: var(--muted); margin: 6px 0 10px; }
  .notice {
    background: #fff6e5; border: 1px solid #f0d9a8; color: #7a5a10;
    border-radius: 9px; padding: 9px 11px; font-size: calc(13px * var(--font-scale));
    margin-bottom: 10px;
  }
  .notice.err { background: #fdeaea; border-color: #f2c2c2; color: #a02121; }

  .stop-list { list-style: none; margin: 0; padding: 0; }
  .stop {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 2px; border-bottom: 1px solid #f0f3f8;
  }
  .stop:last-child { border-bottom: none; }
  .stop-idx {
    flex-shrink: 0; width: 26px; text-align: right;
    font-size: calc(12px * var(--font-scale)); color: #b9c2d2; font-variant-numeric: tabular-nums;
    padding-top: 3px;
  }
  .stop-body { flex: 1 1 auto; min-width: 0; }
  .stop-name { font-size: calc(15px * var(--font-scale)); font-weight: 600; }
  .stop-en { font-size: calc(11px * var(--font-scale)); color: var(--muted); margin-top: 1px; }
  .stop-etas { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .eta {
    background: #f2f5fa; border-radius: 6px; padding: 2px 7px;
    font-size: calc(12px * var(--font-scale)); font-weight: 700;
    font-variant-numeric: tabular-nums; color: #2c4a7c;
  }
  .eta.soon { background: #e6f6ec; color: #17663a; }
  .eta.gone { background: #f0f0f0; color: #8a8a8a; font-weight: 600; }
  .eta.none { background: none; color: #b9c2d2; font-weight: 500; padding-left: 0; }

  /* === MOBILE === */
  @media (max-width: 900px) {
    .layout { flex-direction: column; gap: 10px; padding: 10px; }
    .sidebar { width: auto; max-height: 46vh; }
    .other-modes { margin-top: 12px; }
    .main-area .panel { padding: 10px 12px; }
    header.app-header { padding-left: 12px; padding-right: 12px; }
  }

  /* === BOOT SHELL ===
     Static HTML, never compiled by Vue. #app stays hidden via data-booting
     while this is on screen, so the uncompiled raw template is never painted.
     Built from the real header classes so the header does not jump on takeover. */
  #boot-screen { display: flex; flex-direction: column; height: 100%; }
  #boot-screen .boot-content { flex: 1 1 auto; min-height: 0; background: #f5f7fb; }
  #boot-screen .back-btn, #boot-screen .header-meta { pointer-events: none; }
  #boot-screen .boot-clock { visibility: hidden; }
</style>
<noscript><style>#app[data-booting]{display:flex!important}#boot-screen{display:none!important}</style></noscript>
</head>
<body>

<div id="boot-screen" aria-hidden="true">
  <header class="app-header">
    <a class="back-btn">← 返回</a>
    <h1>
      <span class="header-logo-badge"><img class="header-logo" src="mtr.png" alt="" /></span>
      Ansum 港鐵巴士
    </h1>
    <div class="header-meta"><span class="header-clock boot-clock">00:00:00</span></div>
  </header>
  <div class="boot-content"></div>
</div>

<script>
/* ==================== STATUS-INSET RESOLVER ====================
   Resolves --inset-top: the single value the header's top padding consumes.

   The APK is NOT edge-to-edge (theme Theme.Material.Light.NoActionBar, no
   FLAG_LAYOUT_NO_LIMITS), so Android already lays the WebView out BELOW the
   status bar. The bar occupies zero pixels of the page, env() is 0, and the
   header must gain NO padding for it.

   The shell used to push the measured bar height in as --status-inset on every
   onPageFinished, AFTER first paint; the page then padded itself on top of
   already being below the bar (double-counting) and the header visibly jumped
   ~16px. So the shell's claim is DISCARDED, not clamped — clamping a wrong
   number still adds padding that should not exist. Only a real
   env(safe-area-inset-top) may add padding, which keeps this correct if the
   app is ever made genuinely edge-to-edge. */
(function () {
  var MAX_STATUS = 28;
  function envTop() {
    var probe = document.createElement("div");
    probe.style.cssText =
      "position:absolute;top:0;left:0;width:0;height:env(safe-area-inset-top);" +
      "visibility:hidden;pointer-events:none";
    document.documentElement.appendChild(probe);
    var h = probe.getBoundingClientRect().height || 0;
    probe.parentNode.removeChild(probe);
    return isFinite(h) && h > 0 ? Math.min(h, MAX_STATUS) : 0;
  }
  function enforce() {
    var el = document.documentElement;
    var cur = parseFloat(el.style.getPropertyValue("--status-inset"));
    if (isFinite(cur) && cur !== 0) el.style.setProperty("--status-inset", "0px");
    el.style.setProperty("--inset-top", envTop() + "px");
  }
  var queued = false;
  function schedule() {
    if (queued) return;
    queued = true;
    (window.requestAnimationFrame || setTimeout)(function () { queued = false; enforce(); }, 0);
  }
  if (typeof MutationObserver === "function") {
    new MutationObserver(schedule).observe(document.documentElement, {
      attributes: true, attributeFilter: ["style"],
    });
  }
  window.addEventListener("load", enforce);
  enforce();
  setTimeout(enforce, 300);
  setTimeout(enforce, 1200);
  setTimeout(enforce, 3000);
})();
</script>

<script>
/* ==================== BOOT COORDINATION ==================== */
(function () {
  var revealed = false;
  /* ATOMIC REVEAL: dropping data-booting and removing the shell happen in the
     same task, so the browser paints exactly once. There is never a frame
     where the shell is gone but #app has not been laid out yet. */
  window.__revealApp = function () {
    if (revealed) return;
    revealed = true;
    var app  = document.getElementById("app");
    var boot = document.getElementById("boot-screen");
    if (app) app.removeAttribute("data-booting");
    if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
  };
  /* Watchdog: even if onMounted throws, never strand the user on the shell. */
  setTimeout(window.__revealApp, 8000);
})();
</script>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js" crossorigin="anonymous"></script>
<script>
  /* unpkg is the primary CDN; fall back to jsdelivr so one CDN being blocked
     does not take the page down. */
  if (!window.Vue) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js" crossorigin="anonymous"><\/script>');
  }
</script>

<div id="app" v-cloak data-booting>
  <header class="app-header">
    <a href="index.html" class="back-btn">← 返回</a>
    <h1>
      <span class="header-logo-badge">
        <img class="header-logo" src="mtr.png" alt="港鐵巴士" />
      </span>
      Ansum 港鐵巴士
    </h1>
    <div class="header-meta">
      <span class="header-clock">{{ clockText }}</span>
    </div>
  </header>

  <div class="layout">
    <!-- ================= SIDEBAR ================= -->
    <aside class="panel sidebar">
      <div class="sec-title">地區</div>
      <div class="chips">
        <button v-for="a in AREAS" :key="a.key"
                class="chip" :class="{ active: area === a.key }"
                @click="pickArea(a.key)">{{ a.label }}</button>
      </div>

      <div class="sec-title">路線</div>
      <input class="search" type="search" v-model="query"
             placeholder="輸入路線號，例如 K51" aria-label="搜尋路線" />
      <div class="route-list">
        <button v-for="r in visibleRoutes" :key="r"
                class="route-btn" :class="{ active: route === r }"
                @click="openRoute(r)">
          <span class="route-no">{{ r }}</span>
          <span class="route-desc">{{ ROUTE_DESC[r] || '' }}</span>
        </button>
        <div v-if="!visibleRoutes.length" class="empty-note">沒有符合的路線</div>
      </div>

      <div class="other-modes">
        <div class="sec-title">可選擇其他交通工具</div>
        <a href="index.html" class="mode-link">
          <img class="mode-icon-img" src="bus.png" alt="巴士" />
          <span class="mode-text">
            <span class="mode-title">巴士</span>
            <span class="mode-desc">九巴 / 城巴 / 嶼巴</span>
          </span>
          <span class="mode-arrow">→</span>
        </a>
        <a href="gmb.html" class="mode-link">
          <img class="mode-icon-img" src="gmb.png" alt="專線小巴" />
          <span class="mode-text">
            <span class="mode-title">專線小巴</span>
            <span class="mode-desc">港島 / 九龍 / 新界</span>
          </span>
          <span class="mode-arrow">→</span>
        </a>
        <a href="rmb.html" class="mode-link">
          <img class="mode-icon-img" src="rmb.png" alt="紅色小巴" />
          <span class="mode-text">
            <span class="mode-title">紅色小巴</span>
            <span class="mode-desc">公共小巴路線及收費</span>
          </span>
          <span class="mode-arrow">→</span>
        </a>
      </div>
    </aside>

    <!-- ================= MAIN ================= -->
    <main class="main-area">
      <div class="panel">
        <template v-if="!route">
          <div class="route-head"><h2>港鐵巴士</h2></div>
          <p class="updated">
            選擇左邊的地區與路線，即可看到沿線各站的實時到站時間。
          </p>
          <div v-if="!stopsReady" class="notice">正在載入站點資料…</div>
          <div v-else-if="stopsError" class="notice err">{{ stopsError }}</div>
        </template>

        <template v-else>
          <div class="route-head">
            <h2>{{ route }}</h2>
            <span class="sub">{{ ROUTE_DESC[route] || '' }}</span>
          </div>

          <div class="dir-tabs">
            <button v-for="d in directions" :key="d.key"
                    class="dir-tab" :class="{ active: direction === d.key }"
                    @click="direction = d.key">{{ d.label }}</button>
          </div>

          <div class="updated">
            <span v-if="loading">更新中…</span>
            <span v-else-if="updatedAt">更新於 {{ updatedAt }}　·　每 60 秒自動更新</span>
            <span v-else>尚未取得資料</span>
          </div>

          <div v-if="error" class="notice err">{{ error }}</div>
          <div v-if="!error && route && !currentStops.length && !loading" class="notice">
            此方向暫時沒有班次資料。
          </div>

          <ul class="stop-list">
            <li v-for="(s, i) in currentStops" :key="s.id" class="stop">
              <span class="stop-idx">{{ i + 1 }}</span>
              <div class="stop-body">
                <div class="stop-name">{{ s.zh }}</div>
                <div v-if="s.en" class="stop-en">{{ s.en }}</div>
                <div class="stop-etas">
                  <span v-for="(e, j) in s.etas" :key="j"
                        class="eta" :class="e.cls">{{ e.text }}</span>
                  <span v-if="!s.etas.length" class="eta none">—</span>
                </div>
              </div>
            </li>
          </ul>
        </template>
      </div>
    </main>
  </div>
</div>

<script>
/* ==================== 港鐵巴士（K巴）====================
   資料來源：運輸署 / 港鐵官方 API
     POST https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule
     body {"language":"zh","routeName":"K51"}   ← 兩個參數都必填
   成功回應的 CORS 是 `Access-Control-Allow-Origin: *`，preflight 亦允許 POST，
   所以這個純靜態頁面可以直接呼叫，不需要自架 proxy。
   ⚠️ 但**錯誤**回應（400/404）的 CORS 只給 data.gov.hk，所以錯誤處理只看
   HTTP status，不要去讀 response body。

   一個 request 就回傳**整條路線所有站**（含 D 去程與 U 回程兩組），
   這與九巴／城巴要逐站查不同。

   ⚠️ API 只給 busStopId（例如 K51-D010），**沒有站名、沒有座標**。
   站名與座標來自 mtr-stops.min.json —— 由 tools/build-mtr-stops.js 從
   stops-index.min.json（3.4 MB，全港 15,267 站）抽出港鐵巴士那 676 站
   （70 KB）。叫手機下載 3.4 MB 只為了顯示 676 站並不合理。 */
const API_URL = 'https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule';
const STOPS_URL = 'mtr-stops.min.json';
/* API 自己回報 appRefreshTimeInSecond: 60，照它走。 */
const REFRESH_MS = 60000;
/* arrivalTimeInSecond = 108000（30 小時）是 sentinel，代表「這一站沒有到站預測」
   （通常是總站，只有開出時間）。當成數字處理會顯示「1800 分鐘」。 */
const NO_ARRIVAL = 108000;

/* 站 id 的尾巴：可選字母 + D（去程）/ U（回程）+ 序號。
   ⚠️ 大小寫不統一：K51-D010 但 K52-nD010（小寫 n）。
   用 [A-Z] 會把整條 K52（60 站）漏掉。 */
const STOP_ID_RE = /^(.+?)-([A-Za-z]{0,2})([DU])(\d+)$/;

const AREAS = [
  { key: 'all',      label: '全部' },
  { key: 'taipo',    label: '大埔',   routes: ['K12', 'K14', 'K17', 'K18'] },
  { key: 'tuenmun',  label: '屯門',   routes: ['506', 'K51', 'K51A', 'K52', 'K52A', 'K52P', 'K53', 'K53S', 'K54', 'K54A', 'K58'] },
  { key: 'tsw',      label: '天水圍', routes: ['K73', 'K74', 'K75A', 'K75P', 'K75S', 'K76', 'K76S'] },
  { key: 'yuenlong', label: '元朗',   routes: ['K65', 'K65A', 'K66', 'K68'] },
];

/* 路線簡述，取自官方 spec 的路線表（v1.14）。只作挑選時的提示；
   實際站序以 API 回傳為準。 */
const ROUTE_DESC = {
  '506': '屯門碼頭 ↔ 兆麟',
  'K12': '大埔墟站 ↔ 八號花園',
  'K14': '大埔超級城 → 大埔墟站',
  'K17': '大埔墟站 ↔ 富善',
  'K18': '大埔墟站 ↔ 廣福（循環）',
  'K51': '富泰 ↔ 大欖',
  'K51A': '富泰 ↔ 掃管笏',
  'K52': '悅湖山莊 ↔ 龍鼓灘',
  'K52A': '屯門站 ↔ 曾咀',
  'K52P': '龍鼓灘 → 屯門站',
  'K53': '屯門站 ↔ 掃管笏（循環）',
  'K53S': '屯門站 ↔ 業旺邨（循環）',
  'K54': '和田邨 ↔ 屯門市中心（循環）',
  'K54A': '和田邨 ↔ 兆康站',
  'K58': '富泰 ↔ 掃管笏',
  'K65': '元朗站 ↔ 流浮山',
  'K65A': '天水圍站 ↔ 流浮山',
  'K66': '朗屏 ↔ 大棠黃泥墩村',
  'K68': '元朗工業邨 ↔ 元朗公園（循環）',
  'K73': '天恆 ↔ 元朗西',
  'K74': '天水圍市中心 ↔ 凹頭（循環）',
  'K75A': '天水圍站 ↔ 洪水橋（循環）',
  'K75P': '天瑞 ↔ 洪水橋（循環）',
  'K75S': '天水圍站 ↔ 洪福邨（循環）',
  'K76': '天恆 ↔ 天水圍站',
  'K76S': '濕地公園路 ↔ 天盛苑／港鐵天水圍站',
};

const { createApp, ref, computed, watch, onMounted, onBeforeUnmount } = Vue;

createApp({
  setup() {
    const area = ref('all');
    const query = ref('');
    const route = ref('');
    const direction = ref('D');
    const clockText = ref('');

    const stopsDb = ref(null);          // { stops: { id: {zh,en,lat,lng} } }
    const stopsReady = ref(false);
    const stopsError = ref('');

    const schedule = ref(null);         // last good API payload
    const loading = ref(false);
    const error = ref('');
    const updatedAt = ref('');

    let refreshTimer = null;
    let clockTimer = null;

    /* ---------- 路線清單 ---------- */
    const allRoutes = computed(() => {
      const a = AREAS.find((x) => x.key === area.value);
      if (a && a.routes) return a.routes;
      /* 全部：用資料檔的 routes 為準（那才是 API 真的有站的），
         排序讓人好找：數字路線（506）先，其餘按號碼。 */
      const r = (stopsDb.value && stopsDb.value.routes) || Object.keys(ROUTE_DESC);
      return [...r].sort((x, y) => {
        const nx = parseInt(String(x).replace(/\D/g, ''), 10) || 0;
        const ny = parseInt(String(y).replace(/\D/g, ''), 10) || 0;
        if (nx !== ny) return nx - ny;
        return String(x).localeCompare(String(y));
      });
    });

    const visibleRoutes = computed(() => {
      const q = query.value.trim().toUpperCase().replace(/\s+/g, '');
      if (!q) return allRoutes.value;
      return allRoutes.value.filter((r) => String(r).toUpperCase().replace(/\s+/g, '').includes(q));
    });

    function pickArea(k) { area.value = k; }

    /* ---------- 把 API 的站分成 D / U 兩個方向 ---------- */
    /* rawStops 必須在 directions 之前宣告：computed 是惰性的，兩者都只在
       渲染時求值，但把來源放在消費者上面可以避免日後有人改成 eager 讀取時
       踩到 TDZ。 */
    const rawStops = computed(() => (schedule.value && schedule.value.busStop) || []);

    const directions = computed(() => {
      const groups = groupDirections(rawStops.value);
      const out = [];
      for (const key of ['D', 'U']) {
        const list = groups[key];
        if (!list || !list.length) continue;
        out.push({ key, label: directionLabel(key, list) });
      }
      /* 認不出方向時（id 不符格式）仍然要能顯示。 */
      if (!out.length && rawStops.value.length) {
        out.push({ key: 'D', label: '全部站' });
      }
      return out;
    });

    function groupDirections(stops) {
      const g = {};
      for (const s of stops) {
        const m = STOP_ID_RE.exec(s.busStopId || '');
        const d = m ? m[3] : 'D';
        (g[d] = g[d] || []).push(s);
      }
      return g;
    }

    /* 方向標籤用「首站 → 末站」推出來，比猜「去程／回程」可靠：
       同一條路線號在官方表上有時對應多個起訖組合。 */
    function directionLabel(key, list) {
      const first = stopInfo(list[0]);
      const last = stopInfo(list[list.length - 1]);
      if (first.zh && last.zh && first.zh !== last.zh) return first.zh + ' → ' + last.zh;
      return key === 'D' ? '去程' : '回程';
    }

    function stopInfo(apiStop) {
      const db = (stopsDb.value && stopsDb.value.stops) || {};
      const id = (apiStop && apiStop.busStopId) || '';
      const rec = db[id];
      /* The API gives only an id, so a stop the data file does not know about
         would otherwise render as a bare "K51-D055" — which reads as a broken
         page. New stops do appear (3 K51 stops were added in the Sep 2026
         route update), so fall back to a readable placeholder and keep the id
         on the secondary line for traceability.
         Refresh the data with tools/build-mtr-stops.js to close the gap. */
      return {
        id,
        zh: (rec && rec.zh) || '（未命名站）',
        en: (rec && rec.en) || id,
        known: !!rec,
      };
    }

    /* ---------- 目前方向的站 + 到站時間 ---------- */
    const currentStops = computed(() => {
      const groups = groupDirections(rawStops.value);
      const list = groups[direction.value] || [];
      return list.map((s) => {
        const info = stopInfo(s);
        return {
          id: info.id,
          zh: info.zh,
          en: info.en,
          etas: (s.bus || []).map(busEta).filter(Boolean).slice(0, 3),
        };
      });
    });

    function busEta(bus) {
      const secs = parseInt(bus.arrivalTimeInSecond, 10);
      const hasArrival = isFinite(secs) && secs < NO_ARRIVAL;
      const text = hasArrival ? (bus.arrivalTimeText || '') : (bus.departureTimeText || '');
      if (!text) return null;
      let cls = '';
      if (/離開|Departed/.test(text)) cls = 'gone';
      else if (hasArrival && secs <= 180) cls = 'soon';
      return { text, cls };
    }

    /* ---------- 載入 ---------- */
    async function loadStops() {
      try {
        const res = await fetch(STOPS_URL, { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        stopsDb.value = await res.json();
        stopsReady.value = true;
      } catch (e) {
        stopsError.value = '站點資料載入失敗：' + e.message;
        stopsReady.value = true;
      }
    }

    async function fetchSchedule() {
      if (!route.value) return;
      loading.value = true;
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ language: 'zh', routeName: route.value }),
        });
        /* 429 = 太頻繁；400 = 參數不對。錯誤回應的 CORS 不開放，
           所以只看 status，不要去讀 body。 */
        if (!res.ok) throw new Error(res.status === 429 ? '查詢太頻繁，請稍後再試' : 'HTTP ' + res.status);
        const j = await res.json();
        schedule.value = j;
        error.value = '';
        const t = (j.routeStatusTime || '').split(' ')[1] || '';
        updatedAt.value = t || clockText.value;
        /* 第一次拿到資料時，若目前選的方向不存在，自動切到有站的那個。 */
        const dirs = directions.value;
        if (dirs.length && !dirs.some((d) => d.key === direction.value)) {
          direction.value = dirs[0].key;
        }
      } catch (e) {
        error.value = '到站資料載入失敗：' + e.message;
      } finally {
        loading.value = false;
      }
    }

    function openRoute(r) {
      route.value = r;
      direction.value = 'D';
      schedule.value = null;
      updatedAt.value = '';
      error.value = '';
      /* No fetch here — watch(route) fires and fetches. Calling it in both
         places sent two identical POSTs per tap. */
    }

    function startRefresh() {
      stopRefresh();
      refreshTimer = setInterval(() => { if (route.value) fetchSchedule(); }, REFRESH_MS);
    }
    function stopRefresh() {
      if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    }

    /* 切回前景時立即更新一次：手機放口袋再拿出來，不該等最多 60 秒。 */
    function onVisible() {
      if (!document.hidden && route.value) fetchSchedule();
    }

    onMounted(() => {
      loadStops();
      startRefresh();
      document.addEventListener('visibilitychange', onVisible);
      const tick = () => {
        const d = new Date();
        const p = (n) => String(n).padStart(2, '0');
        clockText.value = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
      };
      tick();
      clockTimer = setInterval(tick, 1000);
      window.__revealApp();
    });

    onBeforeUnmount(() => {
      stopRefresh();
      if (clockTimer) clearInterval(clockTimer);
      document.removeEventListener('visibilitychange', onVisible);
    });

    watch(route, () => { if (route.value) fetchSchedule(); });

    return {
      AREAS, ROUTE_DESC,
      area, query, route, direction, clockText,
      stopsReady, stopsError, loading, error, updatedAt,
      visibleRoutes, directions, currentStops,
      pickArea, openRoute,
    };
  },
}).mount('#app');
</script>
</body>
</html>
